name: Test workflow

on:
  push:
    branches:
      - main
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  test:
    name: Test job
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/reusable_workflow.yml
    strategy:
      matrix:
        platform: [ ubuntu-22.04 ]
        unreal_version: [ 5.5.4 ]
      fail-fast: false
    with:
      platform: ${{ matrix.platform }}
      unreal_version: ${{ matrix.unreal_version }}
    secrets: inherit

  test_fork:
    name: Test job from fork
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/reusable_workflow.yml
    strategy:
      matrix:
        platform: [ ubuntu-22.04 ]
        unreal_version: [ 5.5.4 ]
      fail-fast: false
    with:
      platform: ${{ matrix.platform }}
      unreal_version: ${{ matrix.unreal_version }}
      environment: protected-workflow-environment
    secrets: inherit
